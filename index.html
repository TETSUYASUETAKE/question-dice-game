<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7b267">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="質問サイコロ">
  <meta name="description" content="6面に質問が書かれた3Dサイコロを振って、正面に出た質問に答えるスマホ向けWebゲームです。">
  <title>質問サイコロ</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="top-area" aria-labelledby="app-title">
      <p class="app-label">やさしい質問ゲーム</p>
      <h1 id="app-title">質問サイコロ</h1>
      <p class="lead">カテゴリを選んで、質問が書かれたサイコロをくるん。正面に出た質問に答えよう。</p>
    </section>

    <section class="category-panel" aria-label="質問カテゴリ">
      <button class="category-button is-active" type="button" data-category="all" aria-pressed="true">ぜんぶ</button>
      <button class="category-button" type="button" data-category="ミラートーキング" aria-pressed="false">ミラートーキング</button>
    </section>

    <section class="dice-stage" aria-live="polite">
      <div class="cube-scene" aria-hidden="true">
        <div class="dice" id="dice">
          <div class="dice-face dice-face-front">
            <span class="face-label">正面</span>
            <span class="face-text">質問を準備中</span>
          </div>
          <div class="dice-face dice-face-right">
            <span class="face-label">右</span>
            <span class="face-text">質問を準備中</span>
          </div>
          <div class="dice-face dice-face-back">
            <span class="face-label">うしろ</span>
            <span class="face-text">質問を準備中</span>
          </div>
          <div class="dice-face dice-face-left">
            <span class="face-label">左</span>
            <span class="face-text">質問を準備中</span>
          </div>
          <div class="dice-face dice-face-top">
            <span class="face-label">上</span>
            <span class="face-text">質問を準備中</span>
          </div>
          <div class="dice-face dice-face-bottom">
            <span class="face-label">下</span>
            <span class="face-text">質問を準備中</span>
          </div>
        </div>
      </div>
      <button class="roll-button" id="rollButton" type="button" aria-label="サイコロを振って質問を出す">サイコロをふる</button>
    </section>

    <section class="question-card" aria-labelledby="question-title">
      <p class="card-kicker" id="currentCategory">ぜんぶ</p>
      <h2 id="question-title">どんな質問が出るかな？</h2>
      <p id="questionText">ボタンを押して、最初の質問を出してみよう。</p>
    </section>

    <section class="history-panel" aria-labelledby="history-title">
      <h2 id="history-title">さいきん出た質問</h2>
      <ol id="historyList" class="history-list">
        <li class="empty-history">まだありません</li>
      </ol>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
